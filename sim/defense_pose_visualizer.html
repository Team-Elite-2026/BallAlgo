<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Defense Pose Visualizer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f1;
      color: #1f2933;
    }
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: 100vh;
    }
    aside {
      padding: 18px;
      background: #ffffff;
      border-right: 1px solid #d7dbdf;
      overflow: auto;
    }
    section {
      padding: 18px;
      overflow: auto;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }
    p {
      margin: 0 0 10px;
      font-size: 12px;
      line-height: 1.45;
      color: #536171;
    }
    h2 {
      margin: 18px 0 8px;
      font-size: 14px;
      color: #536171;
    }
    label {
      display: grid;
      gap: 5px;
      margin: 10px 0;
      font-size: 13px;
    }
    input {
      font: inherit;
      padding: 8px 9px;
      border: 1px solid #b9c0c8;
      border-radius: 4px;
    }
    button {
      margin-top: 12px;
      padding: 9px 11px;
      border: 1px solid #1f2933;
      border-radius: 4px;
      background: #1f2933;
      color: #ffffff;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      font-size: 12px;
      background: #f0f2f4;
      padding: 11px;
      border-radius: 4px;
      line-height: 1.45;
    }
    canvas {
      display: block;
      background: #ffffff;
      border: 1px solid #d7dbdf;
      max-width: 100%;
      height: auto;
    }
    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin: 4px 0 10px;
    }
    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
      }
      aside {
        border-right: 0;
        border-bottom: 1px solid #d7dbdf;
      }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>Defense Pose Visualizer</h1>
      <p>This view matches the current defense code: it predicts the future ball, computes the block point on the curved goal boundary, and only activates target velocity in the non-emergency intercept branch.</p>
      <div id="modeBadge" class="pill"></div>

      <h2>Ball</h2>
      <label>Ball X centered cm <input id="ballX" type="number" value="25" step="1"></label>
      <label>Ball Y centered cm <input id="ballY" type="number" value="45" step="1"></label>
      <label>Ball VX field cm/s <input id="ballVx" type="number" value="-30" step="1"></label>
      <label>Ball VY field cm/s <input id="ballVy" type="number" value="-120" step="1"></label>

      <h2>Defense</h2>
      <label>Defended goal X centered cm <input id="goalX" type="number" value="0" step="1"></label>
      <label>Defended goal Y centered cm <input id="goalY" type="number" value="-121.5" step="1"></label>
      <label>A* travel time tau seconds <input id="tau" type="number" value="0.45" step="0.05"></label>

      <button id="draw">Redraw</button>
      <pre id="debug"></pre>
    </aside>

    <section>
      <canvas id="field" width="980" height="1260"></canvas>
    </section>
  </main>

  <script>
    const fieldW = 1820;
    const fieldH = 2430;
    const wallThicknessMm = 22;
    const whiteInsetX = 100;
    const whiteInsetY = 100;
    const chamferMm = 120;
    const centerCircleRadiusMm = 300;

    const fps = 120;
    const gamma = 0.96;
    const yMinCm = 40;
    const xMaxCm = 55;
    const arcCenterXCm = 40;
    const arcCenterYCm = 25;
    const arcRadiusCm = 15;
    const quadraticC = 2000;
    const futureMaxS = 0.5;
    const impactMarginS = 0.08;
    const vMaxX = 0.8;
    const vMaxY = 0.6;
    const omegaMax = 6.0;
    const goalSlotWidthMm = 580;
    const goalSlotDepthMm = 100;
    const ballRadiusMm = 42.67 * 0.5;

    function centeredCmToFieldMm(valueCm, axisMm) {
      return valueCm * 10 + axisMm * 0.5;
    }

    function fieldMmToCenteredCm(valueMm, axisMm) {
      return (valueMm - axisMm * 0.5) / 10;
    }

    function clamp(value, lo, hi) {
      return Math.max(lo, Math.min(hi, value));
    }

    function signNonZero(value) {
      return value < 0 ? -1 : 1;
    }

    function predictDamped(ballX, ballY, ballVx, ballVy, timeS) {
      const dt = 1 / fps;
      const samples = Math.max(0, timeS / dt);
      const dampedTime = Math.abs(1 - gamma) <= 1e-5
        ? timeS
        : dt * (1 - Math.pow(gamma, samples)) / (1 - gamma);
      const velocityScale = Math.pow(gamma, samples);
      return {
        x: ballX + ballVx * dampedTime * 1000,
        y: ballY + ballVy * dampedTime * 1000,
        vx: ballVx * velocityScale,
        vy: ballVy * velocityScale
      };
    }

    function goalLinePoint(ballX, ballY, goalX, goalY) {
      const ballRelXCm = (ballX - goalX) / 10;
      const ballRelYCm = (ballY - goalY) / 10;
      const absX = Math.max(Math.abs(ballRelXCm), 1e-3);
      const m = ballRelYCm / absX;

      let targetRelXCm = 0;
      let targetRelYCm = 0;
      let segment = "top";

      if (m >= 1) {
        segment = "top";
        targetRelXCm = yMinCm / m;
        targetRelYCm = yMinCm;
      } else if (m <= -5 / 11) {
        segment = "side";
        targetRelXCm = xMaxCm;
        targetRelYCm = xMaxCm * m;
      } else {
        segment = "arc";
        const a = 1 + m * m;
        const b = -2 * (yMinCm + arcCenterYCm * m);
        const disc = Math.max(0, b * b - 4 * a * quadraticC);
        targetRelXCm = (-b + Math.sqrt(disc)) / (2 * a);
        targetRelYCm = m * targetRelXCm;
      }

      targetRelXCm *= signNonZero(ballRelXCm);
      return {
        x: goalX + targetRelXCm * 10,
        y: goalY + targetRelYCm * 10,
        headingDeg: Math.atan2(ballRelYCm, ballRelXCm) * 180 / Math.PI,
        segment,
        targetRelXCm,
        targetRelYCm,
        ballRelXCm,
        ballRelYCm
      };
    }

    function goalLineTangentUnit(targetRelXCm, targetRelYCm, segment) {
      if (segment === "top") {
        return { x: 1, y: 0 };
      }
      if (segment === "side") {
        return { x: 0, y: 1 };
      }

      const centerXCm = signNonZero(targetRelXCm) * arcCenterXCm;
      const radialX = targetRelXCm - centerXCm;
      const radialY = targetRelYCm - arcCenterYCm;
      const radialLen = Math.hypot(radialX, radialY);
      if (radialLen <= 1e-5) {
        return { x: 0, y: 1 };
      }

      return {
        x: -radialY / radialLen,
        y: radialX / radialLen
      };
    }

    function vMaxDir(phi) {
      const c = Math.cos(phi);
      const s = Math.sin(phi);
      const denom = (c / vMaxX) ** 2 + (s / vMaxY) ** 2;
      return denom < 1e-9 ? Math.max(vMaxX, vMaxY) : 1 / Math.sqrt(denom);
    }

    function impactTimeForDampedTravel(distanceMm, approachSpeedMps) {
      const distanceM = distanceMm / 1000;
      const dtCam = 1 / fps;
      if (distanceM <= 1e-6) return 0;
      if (approachSpeedMps <= 1e-6) return null;
      if (Math.abs(1 - gamma) <= 1e-5) return distanceM / approachSpeedMps;

      const maxDistanceM = approachSpeedMps * dtCam / (1 - gamma);
      if (maxDistanceM < distanceM) return null;

      const inside = 1 - distanceM * (1 - gamma) / (approachSpeedMps * dtCam);
      if (inside <= 0) return null;
      return Math.log(inside) / Math.log(gamma) * dtCam;
    }

    function defensePose(ballX, ballY, ballVx, ballVy, goalX, goalY, tau) {
      const initial = goalLinePoint(ballX, ballY, goalX, goalY);
      const future = predictDamped(ballX, ballY, ballVx, ballVy, Math.min(tau, futureMaxS));
      const target = goalLinePoint(future.x, future.y, goalX, goalY);

      const ballGoalX = future.x - goalX;
      const ballGoalY = future.y - goalY;
      const ballGoalLen = Math.hypot(ballGoalX, ballGoalY);
      const scoreDistanceMm = Math.hypot(future.x - target.x, future.y - target.y);

      let approachSpeed = null;
      let maxApproachDistanceMm = null;
      let impactTime = null;
      let usesInterceptVelocity = false;
      let targetVx = 0;
      let targetVy = 0;
      let targetOmega = 0;
      let omegaRay = null;
      let vScalar = null;
      let interceptReason = "non-emergency branch not active";

      if (tau <= 0) {
        interceptReason = "tau is zero so only the normal block pose is used";
      } else if (ballGoalLen <= 1e-3) {
        interceptReason = "future ball is too close to the defended goal center";
      } else {
        const uxBallGoalX = ballGoalX / ballGoalLen;
        const uxBallGoalY = ballGoalY / ballGoalLen;
        approachSpeed = -(future.vx * uxBallGoalX + future.vy * uxBallGoalY);

        if (approachSpeed <= 1e-6) {
          interceptReason = "future ball is not moving into goal enough for intercept velocity";
        } else {
          maxApproachDistanceMm = approachSpeed * (1 / fps) / Math.max(1e-5, 1 - gamma) * 1000;
          if (maxApproachDistanceMm < scoreDistanceMm) {
            interceptReason = "future ball cannot travel far enough to reach the block point";
          } else {
            impactTime = impactTimeForDampedTravel(scoreDistanceMm, approachSpeed);
            if (impactTime === null) {
              interceptReason = "damped impact equation has no real solution";
            } else if (impactTime > tau + impactMarginS) {
              interceptReason = "impact is later than tau plus margin, so normal block stays active";
            } else {
              const targetRelX = target.x - goalX;
              const targetRelY = target.y - goalY;
              const targetRelLen = Math.hypot(targetRelX, targetRelY);
              if (targetRelLen <= 1e-3) {
                interceptReason = "target lies too close to the defended goal center";
              } else {
                const rayUx = targetRelX / targetRelLen;
                const rayUy = targetRelY / targetRelLen;
                const pathU = goalLineTangentUnit(target.targetRelXCm, target.targetRelYCm, target.segment);
                const denom = rayUy * pathU.x - rayUx * pathU.y;

                if (Math.abs(denom) <= 1e-5) {
                  interceptReason = "ray and path tangent are too parallel";
                } else {
                  omegaRay = (future.vx * (ballGoalY / 1000) - future.vy * (ballGoalX / 1000)) /
                    Math.max(1e-6, (ballGoalX / 1000) ** 2 + (ballGoalY / 1000) ** 2);
                  const maxV = vMaxDir(Math.atan2(pathU.y, pathU.x));
                  vScalar = clamp(omegaRay * (targetRelLen / 1000) / denom, -maxV, maxV);
                  targetVx = vScalar * pathU.x;
                  targetVy = vScalar * pathU.y;

                  const dRelX = (future.x - target.x) / 1000;
                  const dRelY = (future.y - target.y) / 1000;
                  const dRelLenSq = dRelX * dRelX + dRelY * dRelY;
                  if (dRelLenSq > 1e-6) {
                    const vRelX = future.vx - targetVx;
                    const vRelY = future.vy - targetVy;
                    targetOmega = clamp((dRelY * vRelX - dRelX * vRelY) / dRelLenSq, -omegaMax, omegaMax);
                  }

                  usesInterceptVelocity = true;
                  interceptReason = "non-emergency intercept branch active";
                }
              }
            }
          }
        }
      }

      return {
        initial,
        future,
        target: {
          ...target,
          vx: targetVx,
          vy: targetVy,
          omega: targetOmega
        },
        scoreDistanceMm,
        approachSpeed,
        maxApproachDistanceMm,
        impactTime,
        usesInterceptVelocity,
        omegaRay,
        vScalar,
        interceptReason
      };
    }

    function modeBadgeStyle(active) {
      return active
        ? { label: "Intercept Velocity Active", bg: "#e7f5ea", fg: "#2f7d32" }
        : { label: "Normal Block Pose", bg: "#edf2f7", fg: "#475569" };
    }

    function drawArrow(ctx, x1, y1, x2, y2, color, width = 3, headLength = 11) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLength * Math.cos(angle - 0.45), y2 - headLength * Math.sin(angle - 0.45));
      ctx.lineTo(x2 - headLength * Math.cos(angle + 0.45), y2 - headLength * Math.sin(angle + 0.45));
      ctx.closePath();
      ctx.fill();
    }

    function drawPathFromFieldPoints(ctx, sx, sy, points) {
      ctx.beginPath();
      points.forEach((point, index) => {
        if (index === 0) ctx.moveTo(sx(point.x), sy(point.y));
        else ctx.lineTo(sx(point.x), sy(point.y));
      });
      ctx.stroke();
    }

    function sampleArcPoints(centerX, centerY, radius, startDeg, endDeg, steps = 18) {
      const points = [];
      const startRad = startDeg * Math.PI / 180;
      const endRad = endDeg * Math.PI / 180;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const angle = startRad + (endRad - startRad) * t;
        points.push({
          x: centerX + radius * Math.cos(angle),
          y: centerY + radius * Math.sin(angle)
        });
      }
      return points;
    }

    function goalCurvePoints(goalX, goalY, direction) {
      const topY = goalY + direction * (yMinCm * 10);
      const legTopY = goalY + direction * (arcCenterYCm * 10);
      const leftLegX = goalX - xMaxCm * 10;
      const rightLegX = goalX + xMaxCm * 10;
      const leftArcCenterX = goalX - arcCenterXCm * 10;
      const rightArcCenterX = goalX + arcCenterXCm * 10;
      const arcCenterY = goalY + direction * (arcCenterYCm * 10);
      const radius = arcRadiusCm * 10;

      const leftArc = direction > 0
        ? sampleArcPoints(leftArcCenterX, arcCenterY, radius, 180, 90)
        : sampleArcPoints(leftArcCenterX, arcCenterY, radius, 180, 270);
      const rightArc = direction > 0
        ? sampleArcPoints(rightArcCenterX, arcCenterY, radius, 90, 0)
        : sampleArcPoints(rightArcCenterX, arcCenterY, radius, 270, 360);

      const points = [
        { x: leftLegX, y: goalY },
        { x: leftLegX, y: legTopY },
        ...leftArc,
        { x: goalX + arcCenterXCm * 10, y: topY },
        ...rightArc,
        { x: rightLegX, y: legTopY },
        { x: rightLegX, y: goalY }
      ];
      return points;
    }

    function drawGoalSlot(ctx, sx, sy, goalX, goalY, direction, color) {
      const topY = direction > 0 ? goalY : goalY - goalSlotDepthMm;
      ctx.fillStyle = color;
      ctx.fillRect(
        sx(goalX - goalSlotWidthMm * 0.5),
        sy(topY + goalSlotDepthMm),
        goalSlotWidthMm * scaleValue,
        goalSlotDepthMm * scaleValue
      );
    }

    let scaleValue = 1;

    function drawField(ctx, sx, sy, scale, defendedGoal, result) {
      scaleValue = scale;
      ctx.fillStyle = "#050608";
      ctx.fillRect(sx(0), sy(fieldH), fieldW * scale, fieldH * scale);

      ctx.fillStyle = "#11c53b";
      ctx.beginPath();
      ctx.moveTo(sx(chamferMm), sy(fieldH));
      ctx.lineTo(sx(fieldW - chamferMm), sy(fieldH));
      ctx.lineTo(sx(fieldW), sy(fieldH - chamferMm));
      ctx.lineTo(sx(fieldW), sy(chamferMm));
      ctx.lineTo(sx(fieldW - chamferMm), sy(0));
      ctx.lineTo(sx(chamferMm), sy(0));
      ctx.lineTo(sx(0), sy(chamferMm));
      ctx.lineTo(sx(0), sy(fieldH - chamferMm));
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4;
      ctx.strokeRect(
        sx(whiteInsetX),
        sy(fieldH - whiteInsetY),
        (fieldW - 2 * whiteInsetX) * scale,
        (fieldH - 2 * whiteInsetY) * scale
      );

      ctx.beginPath();
      ctx.moveTo(sx(whiteInsetX), sy(fieldH * 0.5));
      ctx.lineTo(sx(fieldW - whiteInsetX), sy(fieldH * 0.5));
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(sx(fieldW * 0.5), sy(fieldH * 0.5), centerCircleRadiusMm * scale, 0, Math.PI * 2);
      ctx.stroke();

      drawGoalSlot(ctx, sx, sy, fieldW * 0.5, fieldH, -1, "#2563eb");
      drawGoalSlot(ctx, sx, sy, fieldW * 0.5, 0, 1, "#eab308");

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4;
      drawPathFromFieldPoints(ctx, sx, sy, goalCurvePoints(fieldW * 0.5, 0, 1));
      drawPathFromFieldPoints(ctx, sx, sy, goalCurvePoints(fieldW * 0.5, fieldH, -1));

      ctx.fillStyle = "#1f2933";
      ctx.font = "12px Arial";
      ctx.fillText("Blue Goal", sx(fieldW * 0.5 - 38), sy(fieldH) + 22);
      ctx.fillText("Yellow Goal", sx(fieldW * 0.5 - 48), sy(0) - 10);

      ctx.setLineDash([9, 7]);
      ctx.strokeStyle = "#60a5fa";
      ctx.lineWidth = 3;
      const defendedDirection = defendedGoal.y <= fieldH * 0.5 ? 1 : -1;
      drawPathFromFieldPoints(ctx, sx, sy, goalCurvePoints(defendedGoal.x, defendedGoal.y, defendedDirection));
      ctx.setLineDash([]);

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(sx(defendedGoal.x), sy(defendedGoal.y));
      ctx.lineTo(sx(result.future.x), sy(result.future.y));
      ctx.moveTo(sx(defendedGoal.x), sy(defendedGoal.y));
      ctx.lineTo(sx(result.initial.x), sy(result.initial.y));
      ctx.stroke();

      drawArrow(
        ctx,
        sx(defendedGoal.x),
        sy(defendedGoal.y),
        sx(result.future.x),
        sy(result.future.y),
        "#8b949e",
        2,
        9
      );

      drawArrow(
        ctx,
        sx(result.initial.x),
        sy(result.initial.y),
        sx(defendedGoal.x + (result.future.x - defendedGoal.x) * 0.24),
        sy(defendedGoal.y + (result.future.y - defendedGoal.y) * 0.24),
        "#72b7b2",
        2,
        9
      );

      drawArrow(
        ctx,
        sx(result.future.x),
        sy(result.future.y),
        sx(result.future.x + result.future.vx * 850),
        sy(result.future.y + result.future.vy * 850),
        "#ef4444"
      );

      drawArrow(
        ctx,
        sx(values.ballX),
        sy(values.ballY),
        sx(values.ballX + values.ballVx * 850),
        sy(values.ballY + values.ballVy * 850),
        "#f97316"
      );

      if (result.usesInterceptVelocity) {
        drawArrow(
          ctx,
          sx(result.target.x),
          sy(result.target.y),
          sx(result.target.x + result.target.vx * 900),
          sy(result.target.y + result.target.vy * 900),
          "#22c55e"
        );
      }

      const ballDrawR = Math.max(5, ballRadiusMm * scale);
      const points = [
        [defendedGoal.x, defendedGoal.y, "#111827", "goal", 10, -10],
        [result.initial.x, result.initial.y, "#72b7b2", "initial block", 10, 18],
        [result.target.x, result.target.y, "#22c55e", result.usesInterceptVelocity ? "final target" : "block target", 10, -16],
        [result.future.x, result.future.y, "#ef4444", "future ball", 10, -12]
      ];

      ctx.font = "13px Arial";
      for (const [x, y, color, label, dx, dy] of points) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(sx(x), sy(y), 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillText(label, sx(x) + dx, sy(y) + dy);
      }

      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.arc(sx(values.ballX), sy(values.ballY), ballDrawR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillText("ball now", sx(values.ballX) + 10, sy(values.ballY) - 12);
    }

    let values = null;

    function draw() {
      values = {
        ballX: centeredCmToFieldMm(Number(document.getElementById("ballX").value), fieldW),
        ballY: centeredCmToFieldMm(Number(document.getElementById("ballY").value), fieldH),
        ballVx: Number(document.getElementById("ballVx").value) / 100,
        ballVy: Number(document.getElementById("ballVy").value) / 100,
        goalX: centeredCmToFieldMm(Number(document.getElementById("goalX").value), fieldW),
        goalY: centeredCmToFieldMm(Number(document.getElementById("goalY").value), fieldH),
        tau: Number(document.getElementById("tau").value)
      };

      const result = defensePose(
        values.ballX,
        values.ballY,
        values.ballVx,
        values.ballVy,
        values.goalX,
        values.goalY,
        values.tau
      );

      const canvas = document.getElementById("field");
      const ctx = canvas.getContext("2d");
      const pad = 60;
      const scale = Math.min((canvas.width - pad * 2) / fieldW, (canvas.height - pad * 2) / fieldH);
      const ox = (canvas.width - fieldW * scale) / 2;
      const oy = (canvas.height + fieldH * scale) / 2;
      const sx = x => ox + x * scale;
      const sy = y => oy - y * scale;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawField(ctx, sx, sy, scale, { x: values.goalX, y: values.goalY }, result);

      const badge = document.getElementById("modeBadge");
      const badgeStyle = modeBadgeStyle(result.usesInterceptVelocity);
      badge.textContent = badgeStyle.label;
      badge.style.background = badgeStyle.bg;
      badge.style.color = badgeStyle.fg;

      document.getElementById("debug").textContent =
        `target segment=${result.target.segment}\n` +
        `target centered cm=(${fieldMmToCenteredCm(result.target.x, fieldW).toFixed(1)}, ${fieldMmToCenteredCm(result.target.y, fieldH).toFixed(1)})\n` +
        `initial block centered cm=(${fieldMmToCenteredCm(result.initial.x, fieldW).toFixed(1)}, ${fieldMmToCenteredCm(result.initial.y, fieldH).toFixed(1)})\n` +
        `future ball centered cm=(${fieldMmToCenteredCm(result.future.x, fieldW).toFixed(1)}, ${fieldMmToCenteredCm(result.future.y, fieldH).toFixed(1)})\n` +
        `target heading=${result.target.headingDeg.toFixed(1)} deg\n` +
        `target velocity=(${result.target.vx.toFixed(2)}, ${result.target.vy.toFixed(2)}) m/s\n` +
        `target omega=${result.target.omega.toFixed(2)} rad/s\n` +
        `omega_ray=${result.omegaRay === null ? "n/a" : result.omegaRay.toFixed(3) + " rad/s"}\n` +
        `v_scalar=${result.vScalar === null ? "n/a" : result.vScalar.toFixed(3) + " m/s"}\n` +
        `approach speed=${result.approachSpeed === null ? "n/a" : result.approachSpeed.toFixed(2) + " m/s"}\n` +
        `max damped approach distance=${result.maxApproachDistanceMm === null ? "n/a" : result.maxApproachDistanceMm.toFixed(0) + " mm"}\n` +
        `impact time=${result.impactTime === null ? "n/a" : result.impactTime.toFixed(3) + " s"}\n` +
        `score distance=${result.scoreDistanceMm.toFixed(0)} mm\n` +
        `future prediction clamp=${futureMaxS.toFixed(2)} s\n` +
        `intercept velocity active=${result.usesInterceptVelocity}\n` +
        `why=${result.interceptReason}`;
    }

    document.getElementById("draw").addEventListener("click", draw);
    document.querySelectorAll("input").forEach(input => input.addEventListener("input", draw));
    draw();
  </script>
</body>
</html>
