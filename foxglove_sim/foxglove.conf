# Foxglove local live-debugging config for BallAlgo.
# Toggle streams here to minimize latency on the Pi.

enabled = true
websocket_enabled = true
record_mcap = false

stream_paths = true
stream_pose = true
stream_ball = true
stream_velocity = true
stream_trajectory = true
stream_logs = true

stream_lidar = true
stream_camera = true

paths_hz = 15
pose_hz = 30
ball_hz = 30
velocity_hz = 30
trajectory_hz = 30
logs_hz = 1
camera_hz = 10

socket_path = /tmp/ballalgo_foxglove.sock
websocket_host = 0.0.0.0
websocket_port = 8765
record_dir = foxglove_sim/recordings
